<!DOCTYPE html>
<html>
<head>
    <title>FitBuddy | All Users</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #eeeeee;
        }

        .empty {
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/">← New Plan</a>

    <h1>All Users</h1>

    {% if users %}

    <table>

        <tr>
            <th>User ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Weight</th>
            <th>Goal</th>
            <th>Intensity</th>
        </tr>

        {% for user in users %}

        <tr>
            <td>{{ user.user_id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.age }}</td>
            <td>{{ user.weight }} kg</td>
            <td>{{ user.goal }}</td>
            <td>{{ user.intensity }}</td>
        </tr>

        {% endfor %}

    </table>

    {% else %}

    <div class="empty">
        No users found.
    </div>

    {% endif %}

</div>

</body>
</html>
